<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Registration Form</title>
    <link rel="stylesheet" href="style.css"> <!-- Link to external CSS file -->
</head>
<body>
    <div class="form-container">
        <h1 class="heading-title">User Registration Form</h1>
        <form id="registrationForm">
    
        <label for="fullName" class="section-question">Full Name:</label>
        <input type="text" id="fullName" name="fullName" required><br><br>
        <label for="email" class="section-question">Email Address:</label>
        <input type="email" id="email" name="email" required><br><br>


        <label for="password" class="section-question">Password:</label>
        <input type="password" id="password" name="password" required><br><br>


        <label for="confirmPassword" class="section-question">Confirm Password:</label>
        <input type="password" id="confirmPassword" name="confirmPassword" required><br><br>

    
        <label for="age" class="section-question">Age:</label>
        <input type="number" id="age" name="age" required><br><br>

        
        <button type="submit" class="button-styling">Register</button> 
        </form>
        </div>
           <script src="index.js"></script> <!-- Link to external JavaScript file -->
</body>
</html>
